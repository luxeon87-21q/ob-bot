name: MA200 — ложный пробой и отскок (по будням)

on:
  schedule:
    # пн–пт 21:35 UTC (после закрытия: 17:35 по Нью-Йорку летом, 16:35 зимой); второй запуск — на случай,
    # если GitHub пропустит первый (повторно не считает: --if-new)
    - cron: '35 21 * * 1-5'
    - cron: '50 23 * * 1-5'
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Разослать новые сигналы подписчикам в Telegram'
        type: boolean
        default: false
      tickers:
        description: 'Проверить только эти тикеры (через запятую) — без записи на сайт'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Расчёт идёт в своей очереди «ma200»; в общую очередь «scan» встаёт только публикация сайта.
concurrency:
  group: ma200
  cancel-in-progress: false

jobs:
  ma200:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      skip: ${{ steps.scan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Поиск отскоков от MA200
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python ma200.py --tickers "$TICKERS" --no-tg --out cache/ma200_test.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            git config user.name "ob-bot"; git config user.email "ob-bot@users.noreply.github.com"
            git add -f cache/ma200_test.json; git commit -m "MA200: проверка тикеров [skip ci]" || true
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          else
            python ma200.py ${{ github.event_name == 'schedule' && '--if-new' || '' }} ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '--no-tg' || '' }}
          fi

      - name: Сохранить результат
        if: steps.scan.outputs.skip != 'true'
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          for f in cache/ma200.json cache/ma200_sent.json cache/options.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "MA200 $(date -u +'%Y-%m-%d') [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

  deploy:
    needs: ma200
    if: needs.ma200.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # свежее состояние репозитория, вместе с только что сохранённым результатом

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-

      - name: Сборка сайта
        run: python build_site.py --site-only

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
