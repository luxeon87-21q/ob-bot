name: Команды Telegram

on:
  schedule:
    # каждый запуск слушает команды ~110 минут без перерыва (long polling), бот отвечает за секунды;
    # запуски раз в час с запасом — следующий ждёт в очереди и стартует, когда закончится предыдущий
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

env:
  TG_STATE_KEY: ${{ secrets.TG_STATE_KEY }}   # ключ шифрования cache/tg_settings.enc

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: Обработать команды боту
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          python tg.py --loop 110
      - name: Сохранить настройки
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          if [ -e cache/tg_settings.enc ]; then git add cache/tg_settings.enc; fi
          git rm -q --cached --ignore-unmatch cache/tg_settings.json cache/chat_id
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Настройки Telegram [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && break
            sleep 5
          done
