name: Команды Telegram

on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub выполняет расписание с пропусками, поэтому чаще
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

env:
  TG_STATE_KEY: ${{ secrets.TG_STATE_KEY }}   # ключ шифрования cache/tg_settings.enc

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: Обработать команды боту
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python tg.py
      - name: Сохранить настройки
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          if [ -e cache/tg_settings.enc ]; then git add cache/tg_settings.enc; fi
          git rm -q --cached --ignore-unmatch cache/tg_settings.json cache/chat_id
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Настройки Telegram [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
