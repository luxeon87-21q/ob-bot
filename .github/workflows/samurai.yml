name: Опционы — скринер и Самурай (2 раза в день)

on:
  schedule:
    # Окна по Нью-Йорку: утро 10:20–11:50, вечер 14:40–15:50 (пн–пт). Запусков несколько с запасом —
    # GitHub часто пропускает расписание; samurai.py --slot считает каждое окно один раз, остальные выходят сразу.
    # UTC-часы покрывают и летнее, и зимнее время США.
    - cron: '25,55 14,15,16 * * 1-5'
    - cron: '45 18,19,20 * * 1-5'
    - cron: '15 19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Разослать результат подписчикам в Telegram'
        type: boolean
        default: false
      tickers:
        description: 'Проверить выгрузку только по этим тикерам (через запятую) — без записи на сайт'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Расчёт идёт в своей очереди «options» и не мешает проверке ордер-блоков.
# В общую очередь «scan» встаёт только короткая публикация сайта (job deploy).
concurrency:
  group: options
  cancel-in-progress: false

jobs:
  samurai:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      skip: ${{ steps.scan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Выгрузка опционов для сайта
        id: scan
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python optscreen.py --tickers "$TICKERS" --out cache/optscreen_test.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            git config user.name "ob-bot"; git config user.email "ob-bot@users.noreply.github.com"
            git add -f cache/optscreen_test.json; git commit -m "Опционы: проверка тикеров [skip ci]" || true
            for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
          else
            python optscreen.py ${{ github.event_name == 'schedule' && '--slot' || '' }}
          fi

      - name: Самурай (ТЗ) — из выгрузки, Telegram
        if: steps.scan.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python samurai.py --from-dataset ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '--no-tg' || '' }}

      - name: Сохранить выгрузку в кэш
        if: steps.scan.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}

      - name: Сохранить результат
        if: steps.scan.outputs.skip != 'true'
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          for f in cache/samurai.json cache/iv_history.json cache/samurai_vol.json cache/optscreen_info.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "Самурай $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

  deploy:
    needs: samurai
    if: needs.samurai.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # свежее состояние репозитория, вместе с только что сохранённым результатом

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-

      - name: Сборка сайта
        run: python build_site.py --site-only

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
