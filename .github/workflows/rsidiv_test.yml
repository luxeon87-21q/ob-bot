name: Дивергенция RSI — проверочный прогон по ETF

# Запускается вручную или при изменении rsidiv.py. Telegram и сайт не трогает:
# результат — файл cache/rsidiv_test.json (все сигналы за ~2 года и что было с ценой после них).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['rsidiv.py', '.github/workflows/rsidiv_test.yml']

permissions:
  contents: write

concurrency:
  group: rsidiv-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон по ETF
        run: python rsidiv.py --out cache/rsidiv_test.json
      - name: Сохранить результат
        run: |
          git config user.name "ob-bot"; git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/rsidiv_test.json; git commit -m "Дивергенция RSI: проверочный прогон [skip ci]" || true
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
