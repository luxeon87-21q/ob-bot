name: Дивергенция RSI — проверочный прогон по ETF и акциям

# Запускается вручную или при изменении rsidiv.py. Telegram и сайт не трогает:
# результат — файл cache/rsidiv_test.json (все сигналы за ~2 года и что было с ценой после них).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['rsidiv.py', '.github/workflows/rsidiv_test.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rsidiv-test
  cancel-in-progress: true

env:
  TG_STATE_KEY: ${{ secrets.TG_STATE_KEY }}   # нужен сборке сайта (cache/tg_settings.enc)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - name: Прогон по ETF и акциям
        run: python rsidiv.py --stocks --out cache/rsidiv_test.json
      - name: Сохранить результат
        run: |
          git config user.name "ob-bot"; git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/rsidiv_test.json; git commit -m "Дивергенция RSI: проверочный прогон [skip ci]" || true
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done

  # результат — сразу на сайт (вкладка «RSI ETF» → «Проверка на истории»)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-
      - name: Сборка сайта
        run: python build_site.py --site-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
