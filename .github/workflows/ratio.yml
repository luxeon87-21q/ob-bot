name: Пут-ратио под отчёт — поиск страйков

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Только эти тикеры (через запятую), без фильтров IV и дней до отчёта'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ratio
  cancel-in-progress: false

jobs:
  ratio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-
      - name: Поиск
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then python ratio.py --tickers "$TICKERS"; else python ratio.py; fi
      - name: Сохранить
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/ratio.json
          git commit -m "Пут-ратио: поиск [skip ci]" || echo "без изменений"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
