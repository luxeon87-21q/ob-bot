name: Проверка ордер-блоков

on:
  schedule:
    # GitHub часто пропускает запуски по расписанию, поэтому стучимся каждые 20 минут
    # в окне закрытия свечей (13:30 и 16:00 Нью-Йорк, летнее и зимнее время).
    # Если новой свечи ещё нет, запуск завершается за несколько секунд (--if-new).
    - cron: '7,27,47 17-22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Проверка + сборка сайта
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python build_site.py ${{ github.event_name == 'schedule' && '--if-new' || '' }}

      - name: Сохранить кэш свечей
        if: always() && steps.scan.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}

      - name: Сохранить состояние
        if: steps.scan.outputs.skip != 'true'
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          for f in cache/state.json cache/signals.jsonl cache/snapshot.json cache/tg_settings.json cache/universe_*.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "Проверка $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: steps.scan.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.scan.outputs.skip != 'true'
        with:
          path: site
      - id: deployment
        if: steps.scan.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
