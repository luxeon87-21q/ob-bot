name: Три индейца — проверка

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Тикеры через запятую — текущие паттерны и история по ним'
        type: string
        default: ''
      backtest:
        description: 'Статистика по всем акциям США'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indians
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка
        env:
          TICKERS: ${{ inputs.tickers }}
          BT: ${{ inputs.backtest }}
        run: |
          ARGS=""
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --tickers $TICKERS"; fi
          if [ "$BT" = "true" ]; then ARGS="$ARGS --backtest"; fi
          python indians.py $ARGS
      - name: Сохранить результат
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/indians.json
          git commit -m "Три индейца: проверка [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
