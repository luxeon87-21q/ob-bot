name: Компания — отчётность из SEC (по будням)

on:
  schedule:
    # пн–пт 22:20 UTC — после закрытия (10-Q этого дня уже в SEC); ≈00:20 по Кишинёву
    - cron: '20 22 * * 1-5'
  # после правок расчёта — пересчитать сразу (без Telegram)
  push:
    branches: [main]
    paths: ['sec.py', 'fundamentals.py', '.github/workflows/sec.yml']
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sec
  cancel-in-progress: false

env:
  TG_STATE_KEY: ${{ secrets.TG_STATE_KEY }}     # ключ шифрования cache/tg_settings.enc
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }} # контакт для SEC (необязательно: по умолчанию адрес бота)

jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Фундаментал (10-Q / 10-K)
        continue-on-error: true      # отказ SEC не должен останавливать публикацию сайта
        run: python fundamentals.py

      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          for f in cache/fund.json cache/sec_cik.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "SEC $(date -u +'%Y-%m-%d') [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

  deploy:
    needs: sec
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-

      - name: Сборка сайта
        run: python build_site.py --site-only

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
