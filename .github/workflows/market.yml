name: Панель рынка (по будням)

on:
  schedule:
    # пн–пт 21:45 UTC (после закрытия: 17:45 по Нью-Йорку летом, 16:45 зимой); второй запуск — на случай,
    # если GitHub пропустит первый (повторно не считает: --if-new)
    - cron: '45 21 * * 1-5'
    - cron: '55 23 * * 1-5'
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Разослать новые события подписчикам в Telegram'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Расчёт идёт в своей очереди «market»; в общую очередь «scan» встаёт только публикация сайта.
concurrency:
  group: market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      skip: ${{ steps.calc.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Расчёт панели
        id: calc
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python market.py ${{ github.event_name == 'schedule' && '--if-new' || '' }} ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '--no-tg' || '' }}

      - name: Сохранить результат
        if: steps.calc.outputs.skip != 'true'
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          for f in cache/market.json cache/market_sent.json cache/market_caps.json cache/universe_sp500_gics.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "Рынок $(date -u +'%Y-%m-%d') [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

  deploy:
    needs: market
    if: needs.market.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Кэш свечей
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-

      - name: Сборка сайта
        run: python build_site.py --site-only

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
