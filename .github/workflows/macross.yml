name: Второе пересечение — проверка на истории

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macross
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка стратегии
        run: python macross.py --backtest
      - name: Сохранить результат
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/macross_backtest.json
          git commit -m "Второе пересечение: проверка на истории [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
