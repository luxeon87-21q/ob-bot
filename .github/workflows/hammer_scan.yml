name: Хаммер + бабочка (суббота)

on:
  schedule:
    # суббота 07:10 UTC (≈10:10 по Кишинёву летом, 09:10 зимой); второй запуск — на случай,
    # если GitHub пропустит первый (повторно не считает: --if-new)
    - cron: '10 7 * * 6'
    - cron: '40 10 * * 6'
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Разослать результат подписчикам в Telegram'
        type: boolean
        default: false
      tickers:
        description: 'Проверить только эти тикеры (через запятую) — без записи на сайт'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  hammer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Поиск хаммеров и расчёт бабочек
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python hammer.py --scan --tickers "$TICKERS" --out cache/hammer_test.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            git config user.name "ob-bot"; git config user.email "ob-bot@users.noreply.github.com"
            git add -f cache/hammer_test.json; git commit -m "Хаммер: проверка тикеров [skip ci]" || true
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          else
            python hammer.py --scan ${{ github.event_name == 'schedule' && '--if-new' || '' }} ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '--no-tg' || '' }}
          fi

      - name: Сохранить результат
        if: steps.scan.outputs.skip != 'true'
        run: |
          git config user.name "ob-bot"
          git config user.email "ob-bot@users.noreply.github.com"
          git add -f cache/hammer.json
          git commit -m "Хаммер $(date -u +'%Y-%m-%d') [skip ci]" || echo "без изменений"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - name: Кэш свечей
        if: steps.scan.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache/bars
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Выгрузка опционов (из кэша)
        uses: actions/cache/restore@v4
        with:
          path: cache/optscreen.json
          key: optscreen-${{ github.run_id }}
          restore-keys: optscreen-

      - name: Сборка сайта
        if: steps.scan.outputs.skip != 'true'
        run: python build_site.py --site-only

      - uses: actions/configure-pages@v5
        if: steps.scan.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.scan.outputs.skip != 'true'
        with:
          path: site
      - id: deployment
        if: steps.scan.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
